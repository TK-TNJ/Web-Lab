
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Bloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <h1>Create Your Account</h1>
    <p>Join Bloom and get started today.</p>
    <form action="#" method="get">
      <input type="text" placeholder="Full Name" required><br><br>
      <input type="email" placeholder="Email Address" required><br><br>
      <input type="password" placeholder="Password" required><br><br>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <p><br><a href="index.html">Back to Home</a></p>
  </section>
</body>
</html>
